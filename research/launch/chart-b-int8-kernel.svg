x="494" y="608" width="732.419" height="36" rx="4" fill="#e8b875"/><text x="1536" y="637" font-size="36" fill="#f1f4f3" text-anchor="end">102.20 ms</text><path d="M494,708 H1354" stroke="#425159" stroke-width="1"/><text x="494" y="743" font-size="22" fill="#a9b8be" text-anchor="middle">0 ms</text><text x="709" y="743" font-size="22" fill="#a9b8be" text-anchor="middle">30 ms</text><text x="924" y="743" font-size="22" fill="#a9b8be" text-anchor="middle">60 ms</text><text x="1139" y="743" font-size="22" fill="#a9b8be" text-anchor="middle">90 ms</text><text x="1354" y="743" font-size="22" fill="#a9b8be" text-anchor="middle">120 ms</text><text x="64" y="806" font-size="23" fill="#a9b8be" >Excludes corpus initialization, JSON, HTTP and platform overhead. Go SIMD uses experimental archsimd.</text><text x="64" y="850" font-size="23" fill="#a9b8be" >Source: research/vector-cpu-levels.md#measurements · same host / corpus / exact integer results</text></svg>