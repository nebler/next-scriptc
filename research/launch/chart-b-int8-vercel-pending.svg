<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title"><title id="title">Int8 search on Vercel Functions</title><style>text{font-family:'Helvetica Neue',Helvetica,sans-serif;font-weight:500} .heavy{font-weight:700}</style><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101518"/><text x="64" y="76" font-size="56" fill="#f1f4f3" class="heavy">Int8 search on Vercel Functions</text><text x="64" y="121" font-size="27" fill="#a9b8be" >SERVER-SIDE COMPUTE · pending measurement · lower is better</text><text x="64" y="181" font-size="30" fill="#a9b8be" >PENDING · no hosted performance claim</text><text x="64" y="290" font-size="32" fill="#f1f4f3" class="heavy">Patched native</text><text x="64" y="321" font-size="21" fill="#a9b8be" >natural TS + --cpu-dispatch</text><text x="494" y="295" font-size="25" fill="#a9b8be" >Server-side compute (ms)</text><text x="1536" y="298" font-size="32" fill="#a9b8be" text-anchor="end">PENDING</text><text x="64" y="403" font-size="32" fill="#f1f4f3" class="heavy">Go SIMD</text><text x="64" y="434" font-size="21" fill="#a9b8be" >explicit SIMD · experimental</text><text x="494" y="408" font-size="25" fill="#a9b8be" >Server-side compute (ms)</text><text x="1536" y="411" font-size="32" fill="#a9b8be" text-anchor="end">PENDING</text><text x="64" y="516" font-size="32" fill="#f1f4f3" class="heavy">Go plain</text><text x="64" y="547" font-size="21" fill="#a9b8be" >plain Go control</text><text x="494" y="521" font-size="25" fill="#a9b8be" >Server-side compute (ms)</text><text x="1536" y="524" font-size="32" fill="#a9b8be" text-anchor="end">PENDING</text><text x="64" y="629" font-size="32" fill="#f1f4f3" class="heavy">Node</text><text x="64" y="660" font-size="21" fill="#a9b8be" >same natural TypeScript</text><text x="494" y="634" font-size="25" fill="#a9b8be" >Server-side compute (ms)</text><text x="1536" y="637" font-size="32" fill="#a9b8be" text-anchor="end">PENDING</text><text x="64" y="806" font-size="23" fill="#a9b8be" >No hosted bar or ratio is drawn until all values and their source citations are present.</text><text x="64" y="850" font-size="21" fill="#a9b8be" >Source: PENDING · populate every value, source and locator from the hosted route report before posting</text></svg>